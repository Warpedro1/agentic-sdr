services:
  postgres:
    image: postgres:16
    container_name: marina-postgres
    environment:
      POSTGRES_USER: marina
      POSTGRES_PASSWORD: marina
      POSTGRES_DB: marina
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - marina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marina -d marina"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marina-pgdata:
